<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>narcrng</title><link rel="stylesheet" href="style.css"></head><body><main><h1>narcrng</h1><p>Turn an MP3 into a tiny shareable waveform URL. The MP3 stays in your browser.</p><section><h2>Generate</h2><input id="file" type="file" accept="audio/*"><label>Bars <input id="bars" type="range" min="60" max="960" value="480"><output id="bo">480</output></label><label>Bits <select id="bits"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></label><input id="title" maxlength="120" placeholder="optional title"><button id="gen" disabled>Generate link</button><p id="status"></p><div id="preview"></div><div id="linkbox" hidden><input id="url" readonly><button id="copy">Copy</button></div></section><section><h2>Viewer</h2><div id="viewer">Open a generated link to view its waveform.</div></section></main><script src="script.js"></script></body></html>
