<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waveform Tool</title>
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>〰️</text></svg>">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="app">
  <header>
    <h1>Waveform<span>Share</span></h1>
    <p class="sub" id="subtitle">Create and inspect compact audio waveforms.</p>
  </header>

  <section class="card" id="viewer" hidden>
    <div class="meta">
      <span id="metaTitle">Shared waveform</span>
      <span id="metaInfo"></span>
    </div>
    <div class="wave-wrap" id="waveWrap" aria-label="Audio waveform" role="img">
      <div id="waveHost"></div>
      <div class="playhead" id="playhead"></div>
    </div>
    <div class="controls">
      <button id="playBtn" class="btn primary" disabled aria-label="Play">
        <svg viewBox="0 0 24 24" width="20" height="20" id="playIcon"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      </button>
      <div class="time"><span id="cur">0:00</span> / <span id="tot">0:00</span></div>
      <label class="btn ghost" for="audioLocal" id="loadAudioLbl">Load audio to play</label>
      <input type="file" id="audioLocal" accept="audio/*,video/mp4" hidden>
    </div>
    <p class="hint" id="playHint">Playback only works if you load the original audio file from your own device. It is never uploaded.</p>
  </section>

  <section class="card" id="empty">
    <p>No waveform loaded.</p>
  </section>

  <section class="card" id="generator">
    <h2>Create a waveform</h2>
    <label class="drop" id="drop" for="audioGen">
      <input type="file" id="audioGen" accept="audio/*,video/mp4" hidden>
      <strong>Choose an audio file</strong>
      <small>Decoded in your browser. Nothing leaves your device.</small>
    </label>
    <div class="grid">
      <label>Bars <output id="barsOut">480</output>
        <input type="range" id="bars" min="60" max="960" step="20" value="480"></label>
      <label>Bits per bar
        <select id="bits"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></label>
      <label>Title <input type="text" id="title" maxlength="40" placeholder="optional" ></label>
    </div>
    <div id="result" hidden>
      <div class="stats" id="stats"></div>
      <div class="warn" id="warn" hidden></div>
      <textarea id="urlBox" readonly rows="4" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn primary" id="copyBtn">Copy link</button>
        <button class="btn ghost" id="svgBtn">Download SVG</button>
      </div>
      <p class="hint">The generated reference can be copied when you are ready.</p>
    </div>
  </section>
</main>
<script src="script.js?v=3"></script>
